{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <p class="meta">{{ .Date.Format "2006-01-02" }}{{ with .Params.author }} · {{ . }}{{ end }}</p>
  {{ with .Params.announcement }}
  <aside><strong>Announcement text:</strong> {{ .text }}</aside>
  {{ end }}
  {{ .Content }}
</article>
{{ end }}
